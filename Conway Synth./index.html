<!DOCTYPE html>

<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        B3/S23 MATH TRIBUTE AS A CUTE MUSICAL INSTRUMENT.
    </title>


    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <main class="rack">


        <header>

            <p>
                CONWAY SYNTH. AS A B3/S23 MATH TRIBUTE.
            </p>

        </header>



        <section class="screen">


            <canvas id="grid" width="900" height="500">
            </canvas>

            <div class="analyzer">

                <h2>
                    FREQUENCY ANALYZER
                </h2>


                <canvas id="spectrum" width="900" height="150">
                </canvas>

            </div>


            <div class="monitor">


                <div>
                    GEN:
                    <span id="generation">
                        0000
                    </span>
                </div>


                <div>
                    POP:
                    <span id="population">
                        000
                    </span>
                </div>


                <div>
                    STATE:
                    <span id="state">
                        WAITING
                    </span>
                </div>


            </div>
            <div>
                BIO ENERGY:
                <span id="energy">
                    0%
                </span>
            </div>

            <div>
                BIO DENSITY:
                <span id="bio-density">
                    0%
                </span>
            </div>

            <div>
                BIO MOVEMENT:
                <span id="movement">
                    0%
                </span>
            </div>

            <div class="bio-monitor hidden">
    ...
</div>


        </section>





        <section class="modules">



            <div class="module">

                <h2>
                    CLOCK
                </h2>


                <div class="knob" id="tempo-knob"></div>

                <label>
                    TEMPO
                </label>


                <input id="tempo" type="range" min="40" max="180" value="90">


            </div>






            <div class="module">

               <h2>
                OSC A
               </h2>


                <div class="knob" id="oscA-knob"></div>

                <label>
                    LEVEL
                </label>

                <input id="oscA" type="range" min="0" max="100" value="50">


                <select id="oscA-wave">

                    <option value="sine">
                        SINE
                    </option>

                    <option value="triangle" selected>
                        TRIANGLE
                    </option>

                    <option value="sawtooth">
                        SAW
                    </option>

                    <option value="square">
                        SQUARE
                    </option>

                </select>


            </div>






            <div class="module">

               <h2>OSC B</h2>


                <div class="knob" id="oscB-knob"></div>

                <label>
                    LEVEL
                </label>


                <input id="oscB" type="range" min="0" max="100" value="50">


                <select id="oscB-wave">

                    <option value="sine">
                        SINE
                    </option>

                    <option value="triangle">
                        TRIANGLE
                    </option>

                    <option value="sawtooth">
                        SAW
                    </option>

                    <option value="square">
                        SQUARE
                    </option>


                </select>


            </div>






            <div class="module">

                <h2>
                    FILTER
                </h2>


                <div class="knob" id="cutoff-knob"></div>

                <label>
                    CUTOFF
                </label>


                <input id="cutoff" type="range" min="0" max="100" value="70">


            </div>







            <div class="module">

                <h2>
                    ENVELOPE
                </h2>


                <div class="knob" id="attack-knob"></div>

                <label>
                    ATTACK
                </label>


                <input id="attack" type="range" min="0" max="100" value="20">



                <div class="knob" id="release-knob"></div>


                <label>
                    RELEASE
                </label>


                <input id="release" type="range" min="0" max="100" value="60">


            </div>







            <div class="module">

                <h2>
                    MASTER
                </h2>


                <div class="knob" id="volume-knob"></div>


                <label>
                    OUTPUT
                </label>


                <input id="volume" type="range" min="0" max="100" value="70">


            </div>



        </section>





       <footer>

    <div class="transport">

        <button id="start">
            CULTIVATE
        </button>

        <button id="stop">
            FREEZE
        </button>

        <button id="reset">
            NEW LIFE
        </button>

    </div>

    <p class="footer-signature">
        ø Conway_Synth. This is being read by someone who is undoubtedly beautiful and curious.
    </p>

</footer>
    


    </main>



    <script type="module" src="js/main.js"></script>




</body>

</html>
