<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#010109"
    >

    <title>ZERO INFINIT — node∅</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <canvas
        id="cosmos"
        aria-label="Zero Infinit node empty"
    ></canvas>


    <main
        class="interface"
        aria-hidden="true"
    >

        <div class="identity">

            <div class="title">
                ZERO INFINIT
            </div>

            <div class="node">
                node∅
            </div>

        </div>


        <div class="field-status">

            <span class="status-dot"></span>

            <span id="status">
                FIELD
            </span>

        </div>


        <div class="coordinates">

            <span id="coordX">0.000</span>
            <span> / </span>
            <span id="coordY">0.000</span>

        </div>


        <div class="frequency">

            <span id="frequency">
                F# · 185 Hz
            </span>

        </div>


        <div class="instruction">

            <span class="instruction-main">
                MOVE THROUGH THE FIELD
            </span>

            <span class="instruction-sub">
                touch · move · listen
            </span>

        </div>


        <div class="footer">

            <span>
                F# MINOR
            </span>

            <span>
                44.1 kHz · FLOAT
            </span>

            <span>
                SPATIAL FIELD
            </span>

        </div>

    </main>


    <script
        src="main.js"
        defer
    ></script>

</body>

</html>
