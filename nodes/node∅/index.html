<canvas
    id="cosmos"

></canvas>


<main
    class="interface"
    aria-hidden="true"
>

    <div class="identity">

        <div class="title">
            ZERO INFINIT

        <div class="node">
            node∅
        </div>

    </div>


    <div

        id="fieldStatus"
    >

        <span class="status-dot"></span>

        <span id="status">
            CAMP
        </span>

    </div>


    <div
        class="coordinates"
        id="coordinates"
    >

        <span id="coordX">0.000</span>

        <span> / </span>

        <span id="coordY">0.000</span>

    </div>


    <div
        class="frequency"
        id="frequencyDisplay"
    >

        <span id="frequency">
            F# · 185 Hz
        </span>

    </div>


    <div
        class="instruction"
        id="instruction"
    >

        <span
            class="instruction-main"
            id="instructionMain"
        >
            OBSERVA EL FOTÓ
        </span>

        <span
            class="instruction-sub"
            id="instructionSub"
        >
            el camp evoluciona per si mateix
        </span>

    </div>


    <div
        class="footer"
        id="footer"
    >

        <span>
            F# MENOR
        </span>

        <span>
            44.1 kHz · FLOTANT
        </span>

        <span>
            CAMP ESPACIAL
        </span>

    </div>

</main>


<script
    src="main.js"
    defer
></script>
