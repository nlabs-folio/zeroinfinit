<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08070b"
    >

    <title>ZERO INFINIT · MATÈRIA</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main id="experience">

        <!-- ==================================================
             MATÈRIA
             ================================================== -->

        <canvas
            id="cosmos"
            aria-hidden="true"
        ></canvas>


        <!-- ==================================================
             FENOMENOLOGIA
             
             Fórmules i símbols.
             Sense descripcions.
             ================================================== -->

        <div
            id="phenomenology"
            aria-hidden="true"
        >

            <div id="formula"></div>

            <div id="notation"></div>

        </div>


        <!-- ==================================================
             PONT FOTÒNIC
             ================================================== -->

        <div
            id="resonance"
            aria-hidden="true"
        ></div>


        <!-- ==================================================
             ENTRADA
             
             No és una instrucció.
             És simplement el llindar de l'obra.
             ================================================== -->

        <div
            id="threshold"
            aria-hidden="true"
        >

            <div
                id="threshold-symbol"
            >
                ◌
            </div>

        </div>

    </main>


    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
