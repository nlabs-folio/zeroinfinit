<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        2'N'B GROOVE
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


<h1>
    2'N'B GROOVE
</h1>


<!-- =====================================================
     TRANSPORT
===================================================== -->

<div class="transport">


    <button id="start">
        PLAY
    </button>


    <button id="tap">
        TAP
    </button>


    <div class="tempo-control">

        <label>
            BPM
        </label>

        <input
            id="bpm"
            type="range"
            min="60"
            max="220"
            value="174"
        >

        <span id="bpm-value">
            174
        </span>

    </div>


    <div class="style-control">

        <label>
            STYLE
        </label>

        <select id="style">

            <option value="jungle">
                JUNGLE
            </option>

            <option value="liquid">
                LIQUID
            </option>

            <option value="intelligentDnB">
                INTELLIGENT DNB
            </option>

            <option value="neuro">
                NEURO
            </option>

            <option value="atmospheric">
                ATMOSPHERIC
            </option>

        </select>

    </div>


    <div class="swing-control">

        <label>
            SWING
        </label>

        <input
            id="swing"
            type="range"
            min="0"
            max="50"
            value="0"
        >

    </div>


</div>



<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <button id="clear">
        CLEAR
    </button>

    <button id="random">
        RANDOM
    </button>

</div>



<!-- =====================================================
     DRUMS
===================================================== -->

<section class="track-section">


    <div class="track-section-title">
        DRUMS
    </div>


    <div id="drum-grid"></div>


</section>



<!-- =====================================================
     MUSICAL
===================================================== -->

<section class="track-section musical-section">


    <div class="track-section-title">
        MUSICAL
    </div>


    <div id="music-grid">


        <div class="music-track">

            <span class="track-label">
                BASS
            </span>

            <div class="music-track-placeholder">
                BASS
            </div>

        </div>


        <div class="music-track">

            <span class="track-label">
                PAD
            </span>

            <div class="music-track-placeholder">
                PAD
            </div>

        </div>


        <div class="music-track">

            <span class="track-label">
                LEAD
            </span>

            <div class="music-track-placeholder">
                LEAD
            </div>

        </div>


    </div>


</section>



<!-- =====================================================
     TOUCH PAD
===================================================== -->

<section class="touch-section">


    <div class="track-section-title">
        TOUCH
    </div>


    <div
        id="dfield"
        aria-label="Touch Pad"
    >

        <div class="touch-point"></div>

    </div>


    <div class="touch-mode">

        <button
            class="touch-mode-button active"
            data-mode="filter"
        >
            FILTER
        </button>

        <button
            class="touch-mode-button"
            data-mode="delay"
        >
            DELAY
        </button>

        <button
            class="touch-mode-button"
            data-mode="arp"
        >
            ARP
        </button>

    </div>


</section>


<script
    type="module"
    src="./main.js"
></script>


</body>

</html>
