<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quars — profunditat sonora</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #090c12;
      --foreground: #dcecff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: system-ui, sans-serif;
    }

    #visual {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #ui {
      position: fixed;
      z-index: 10;
      top: 1rem;
      left: 1rem;
      display: flex;
      gap: .5rem;
    }

    button {
      border: 1px solid rgba(180, 220, 255, .25);
      border-radius: .35rem;
      padding: .65rem 1rem;
      background: rgba(20, 30, 45, .8);
      color: var(--foreground);
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    button:hover {
      background: rgba(50, 75, 105, .85);
    }
  </style>
</head>

<body>
  <canvas id="visual"></canvas>

  <div id="ui">
    <button id="start">Iniciar</button>
    <button id="stop">Aturar</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
