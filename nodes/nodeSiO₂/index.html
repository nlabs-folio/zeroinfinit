<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quartz Void — Documentary Passage</title>

<style>
:root {
  --bg: #03050c;
  --cyan: #62e8ff;
  --blue: #327dff;
  --violet: #ad76ff;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
}

body {
  display: grid;
  place-items: center;
  color: var(--cyan);
  font-family: monospace;
  cursor: crosshair;
  touch-action: none;
}

canvas {
  width: min(100vw, 1280px);
  height: min(100vh, 720px);
  aspect-ratio: 16 / 9;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #03050c;
  border: 1px solid #245482;
  box-shadow:
    0 0 0 5px #081121,
    0 0 0 6px #153454,
    0 0 50px rgba(42,135,220,.45),
    inset 0 0 45px rgba(25,90,170,.25);
}

#start {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: rgba(2,5,13,.82);
  cursor: pointer;
}

#start span {
  padding: 18px 25px;
  border: 1px solid var(--cyan);
  background: #071426;
  box-shadow:
    0 0 14px rgba(80,215,255,.6),
    inset 0 0 18px rgba(50,130,255,.2);
  font-size: 12px;
  letter-spacing: .18em;
  text-align: center;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<canvas id="screen" width="320" height="180"></canvas>

<div id="start">
  <span>ENTER THE QUARTZ VOID</span>
</div>

<script>
"use strict";

/* ----------------------------------------------------
   CONFIGURACIÓ
----------------------------------------------------- */

const canvas = document.querySelector("#screen");
const ctx = canvas.getContext("2d", { alpha: false });

const start = document.querySelector("#start");
const W = canvas.width;
const H = canvas.height;

const TAU = Math.PI * 2;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const midiToHz = n => 440 * Math.pow(2, (n - 69) / 12);

let time = 0;
let lastTime = performance.now();

let pointer = {
  x: W / 2,
  y: H / 2,
  targetX: W / 2,
  targetY: H / 2
};

let camera = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0,
  zoom: 1,
  targetZoom: 1
};

let crystals = [];
let particles = [];
let stars = [];
let cultivationMode = false;
let cultivationEnergy = 0;
let cultivationPulse = 0;

let journey = 0;
let activity = 0;
let started = false;
let lastResonance = -Infinity;

/* ----------------------------------------------------
   ÀUDIO PROCEDURAL
----------------------------------------------------- */

let audio;
let master;
let masterFilter;
let reverb;
let reverbGain;

let voidOsc;
let voidGain;
let voidFilter;

function impulseResponse(duration = 5.5, decay = 3.8) {
  const length = Math.floor(audio.sampleRate * duration);
  const buffer = audio.createBuffer(2, length, audio.sampleRate);

  for (let channel = 0; channel < 2; channel++) {
    const data = buffer.getChannelData(channel);

    for (let i = 0; i < length; i++) {
      const t = i / length;
      data[i] =
        (Math.random() * 2 - 1) *
        Math.pow(1 - t, decay) *
        .55;
    }
  }

  return buffer;
}
function cultivateQuartz(dt) {
  if (!cultivationMode) {
    cultivationEnergy *= Math.pow(.96, dt);
    return;
  }

  const worldX = camera.x + pointer.x - W / 2;
  const worldY = camera.y + pointer.y - H / 2;

  let nearest = null;
  let nearestDistance = Infinity;

  for (const crystal of crystals) {
    const dx = crystal.x - worldX;
    const dy = crystal.baseY - worldY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < nearestDistance) {
      nearest = crystal;
      nearestDistance = distance;
    }
  }

  if (nearest && nearestDistance < 28) {
    const influence = 1 - nearestDistance / 28;

    nearest.targetHeight +=
      .018 * influence * dt;

    nearest.growth +=
      .000035 * influence * dt;

    nearest.resonance = clamp(
      nearest.resonance + .003 * influence * dt,
      0,
      1
    );

    nearest.opacity = clamp(
      nearest.opacity + .008 * influence * dt,
      0,
      1
    );

    cultivationEnergy = clamp(
      cultivationEnergy + .012 * influence * dt,
      0,
      1
    );

    cultivationPulse += .08 * influence * dt;

    if (
      Math.random() <
      .0025 * influence * dt
    ) {
      particles.push({
        x: nearest.x,
        y: nearest.baseY - nearest.height,
        vx: rand(-.12, .12),
        vy: rand(-.4, -.08),
        life: rand(35, 70),
        color: nearest.hue === "cyan"
          ? "#d9fbff"
          : "#f4d9ff"
      });
    }

    if (
      cultivationEnergy > .75 &&
      Math.random() < .004 * dt
    ) {
      crystalResonance(
        .35 + influence * .45,
        (pointer.x / W - .5) * 2,
        nearest.scale
      );

      cultivationEnergy *= .45;
    }
  }

  cultivationPulse *= Math.pow(.9, dt);
}


function startAudio() {
  if (started) {
    audio.resume();
    return;
  }

  started = true;
  audio = new AudioContext();

  master = audio.createGain();
  master.gain.value = .075;

  masterFilter = audio.createBiquadFilter();
  masterFilter.type = "lowpass";
  masterFilter.frequency.value = 4200;
  masterFilter.Q.value = .55;

  const compressor = audio.createDynamicsCompressor();
  compressor.threshold.value = -28;
  compressor.knee.value = 18;
  compressor.ratio.value = 3;
  compressor.attack.value = .025;
  compressor.release.value = .7;

  master.connect(masterFilter);
  masterFilter.connect(compressor);
  compressor.connect(audio.destination);

  reverb = audio.createConvolver();
  reverb.buffer = impulseResponse();

  reverbGain = audio.createGain();
  reverbGain.gain.value = .24;

  reverb.connect(reverbGain);
  reverbGain.connect(compressor);

  /* El buit: oscil·lador permanent, però respiratori */
  voidOsc = audio.createOscillator();
  voidGain = audio.createGain();
  voidFilter = audio.createBiquadFilter();

  voidOsc.type = "sine";
  voidOsc.frequency.value = midiToHz(30);
  voidGain.gain.value = .018;

  voidFilter.type = "lowpass";
  voidFilter.frequency.value = 180;
  voidFilter.Q.value = 1.2;

  voidOsc.connect(voidGain);
  voidGain.connect(voidFilter);
  voidFilter.connect(master);
  voidOsc.start();

  /* Modulació molt lenta del buit */
  const voidLfo = audio.createOscillator();
  const voidLfoGain = audio.createGain();

  voidLfo.type = "sine";
  voidLfo.frequency.value = .017;
  voidLfoGain.gain.value = 2.8;

  voidLfo.connect(voidLfoGain);
  voidLfoGain.connect(voidOsc.frequency);
  voidLfo.start();

  /* Cos mineral: harmònics molt baixos */
  const fundamental = rand(82, 104);
  const ratios = [1, 2.01, 3.01, 4.02, 5.03, 7.01];

  ratios.forEach((ratio, i) => {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    const filter = audio.createBiquadFilter();

    osc.type = i === 0 ? "sine" : "triangle";
    osc.frequency.value = fundamental * ratio;

    gain.gain.value = .012 / Math.pow(i + 1, .9);

    filter.type = "lowpass";
    filter.frequency.value = 1700 + i * 500;
    filter.Q.value = .7;

    osc.connect(gain);
    gain.connect(filter);
    filter.connect(master);
    osc.start();
  });

  audio.resume();
}

function crystalResonance(intensity, direction, crystalSize = 1) {
  if (!audio) return;

  const now = audio.currentTime;

  if (now - lastResonance < .16) return;
  lastResonance = now;

  const osc = audio.createOscillator();
  const gain = audio.createGain();
  const filter = audio.createBiquadFilter();
  const pan = audio.createStereoPanner();

  const root = rand(850, 2600) * (1 + crystalSize * .15);
  const duration = rand(1.6, 3.8);

  osc.type = Math.random() < .7 ? "sine" : "triangle";
  osc.frequency.setValueAtTime(root, now);
  osc.frequency.exponentialRampToValueAtTime(
    root * rand(.72, 1.3),
    now + duration
  );

  filter.type = "bandpass";
  filter.frequency.value = root;
  filter.Q.value = rand(14, 30);

  pan.pan.value = clamp(direction, -1, 1);

  const volume = (.006 + intensity * .014) * (1 + crystalSize * .15);

  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    now + rand(.05, .14)
  );
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + duration
  );

  osc.connect(gain);
  gain.connect(filter);
  filter.connect(pan);

  pan.connect(master);
  pan.connect(reverb);

  osc.start(now);
  osc.stop(now + duration + .1);
}

function updateAudio() {
  if (!audio) return;

  const horizontal = pointer.x / W;
  const vertical = pointer.y / H;
  const movement = Math.abs(camera.vx) + Math.abs(camera.vy);

  const note = lerp(27, 44, horizontal);

  voidOsc.frequency.setTargetAtTime(
    midiToHz(note) + movement * 2,
    audio.currentTime,
    .8
  );

  voidGain.gain.setTargetAtTime(
  .014 +
  activity * .026 +
  cultivationEnergy * .018 +
  cultivationPulse * .01 +
  Math.sin(time * .00035) * .003,
  audio.currentTime,
  .7
);


  voidFilter.frequency.setTargetAtTime(
    lerp(80, 420, 1 - vertical) + activity * 180,
    audio.currentTime,
    .9
  );

  reverbGain.gain.setTargetAtTime(
    lerp(.14, .42, horizontal) + activity * .08,
    audio.currentTime,
    1
  );

  masterFilter.frequency.setTargetAtTime(
    lerp(2300, 6500, 1 - vertical) + activity * 900,
    cultivationEnergy * 1800,
    audio.currentTime,
    1.2
  );
}
window.addEventListener("keydown", event => {
  if (event.code === "KeyC") {
    cultivationMode = !cultivationMode;

    if (cultivationMode) {
      cultivationEnergy = .15;
    }
  }
});


/* ----------------------------------------------------
   MÓN CRISTAL·LÍ
----------------------------------------------------- */

function resetWorld() {
  crystals = [];
  particles = [];
  stars = [];

  for (let i = 0; i < 90; i++) {
    stars.push({
      x: rand(-W, W * 2),
      y: rand(8, H - 20),
      z: rand(.1, 1),
      phase: rand(0, TAU),
      size: Math.random() < .85 ? 1 : 2
    });
  }

  for (let i = 0; i < 38; i++) {
    createCrystal(
      rand(-W, W * 2),
      rand(H * .46, H * .94),
      rand(.35, 1.5),
      rand(.1, 1)
    );
  }
}

function createCrystal(x, y, scale, depth) {
  crystals.push({
    x,
    y,
    baseY: y,
    scale,
    depth,

    height: 1,
    targetHeight: rand(22, 68) * scale,
    width: rand(2, 6) * scale,

    phase: rand(0, TAU),
    growth: rand(.003, .011) * scale,

    hue: Math.random() < .68 ? "cyan" : "violet",

    state: "nucleation",
    age: 0,
    opacity: 0,
    resonance: 0,
    resonated: false
  });
}
function updateCrystals(dt) {
  let mineralActivity = 0;

  for (const c of crystals) {
    c.age += dt;

    if (c.state === "nucleation") {
      c.opacity = lerp(c.opacity, .4, .035 * dt);
      c.height += c.growth * .35 * dt;

      if (c.age > c.nucleationDuration) {
        c.state = "growth";
      }
    }

    if (c.state === "growth") {
      c.opacity = lerp(c.opacity, 1, .04 * dt);
      c.height += c.growth * dt;

      mineralActivity += c.growth;

      if (c.height >= c.targetHeight * .72) {
        c.state = "resonance";
      }
    }

    if (c.state === "resonance") {
      c.opacity = lerp(c.opacity, 1, .04 * dt);
      c.height = lerp(
        c.height,
        c.targetHeight,
        .025 * dt
      );

      c.resonance = lerp(
        c.resonance,
        1,
        .035 * dt
      );

      if (!c.resonated) {
        c.resonated = true;

        if (audio) {
          crystalResonance(
            .35 + c.depth * .45,
            clamp((c.x - pointer.x) / 110, -1, 1),
            c.scale
          );
        }
      }

      if (c.resonance > .9) {
        c.state = "stable";
      }
    }

    if (c.state === "stable") {
      c.opacity = lerp(c.opacity, 1, .02 * dt);
      c.resonance *= Math.pow(.994, dt);

      c.height =
        c.targetHeight +
        Math.sin(time * .001 + c.phase) *
        c.targetHeight *
        .022;
    }

    /*
      Només desapareixen quan queden clarament enrere.
      Amb el signe correcte segons el sentit de navegació.
    */
    const behindCamera =
      c.x < camera.x - W * 1.8;

    if (behindCamera) {
      c.state = "dissolving";
    }

    if (c.state === "dissolving") {
      c.opacity -= .006 * dt;
    }
  }

  crystals = crystals.filter(c => c.opacity > .005);

  activity = clamp(
    activity + mineralActivity * .09,
    0,
    1
  );

  activity *= Math.pow(.985, dt);

  /*
    Sempre mantenim una reserva mínima de cristalls.
  */
  if (crystals.length < 42) {
    createCrystal(
      camera.x + rand(W * .7, W * 1.6),
      rand(H * .46, H * .93),
      rand(.35, 1.35),
      rand(.1, 1)
    );
  }
}



/* ----------------------------------------------------
   CÀMERA / NAVEGACIÓ
----------------------------------------------------- */

function amera(dt) {
  const nx = (pointer.x / W - .5) * 2;
  const ny = (pointer.y / H - .5) * 2;

  const desiredX = nx * 1.8;
  const desiredY = ny * .65;

  camera.vx += (desiredX - camera.vx) * .025 * dt;
  camera.vy += (desiredY - camera.vy) * .025 * dt;

  camera.vx *= Math.pow(.88, dt);
  camera.vy *= Math.pow(.88, dt);

  const driftX = Math.sin(time * .00011) * .035;
  const driftY = Math.sin(time * .00017 + 2) * .012;

  camera.x += (camera.vx + driftX) * dt;
  camera.y += (camera.vy + driftY) * dt;

  camera.x = clamp(camera.x, -W * .9, W * .9);
  camera.y = clamp(camera.y, -H * .28, H * .28);

  camera.targetZoom = lerp(.88, 1.12, pointer.y / H);
  camera.zoom = lerp(camera.zoom, camera.targetZoom, .018 * dt);

  journey += Math.abs(camera.vx) * dt;
}

/* ----------------------------------------------------
   PROJECCIÓ
----------------------------------------------------- */

function project(c, t) {
  const parallax = .25 + c.depth * .9;

  const rawX =
    c.x -
    camera.x * parallax +
    Math.sin(t * .00025 + c.phase) * c.depth * 8;

  const rawY =
    c.baseY -
    camera.y * parallax +
    Math.sin(t * .0005 + c.phase) * c.depth * 2;

  const scale = (.45 + c.depth * .7) * camera.zoom;

  return {
    x: W / 2 + (rawX - W / 2) * camera.zoom,
    y: H / 2 + (rawY - H / 2) * camera.zoom,
    scale,
    height: c.height * scale,
    width: c.width * scale
  };
}

/* ----------------------------------------------------
   DIBUIX
----------------------------------------------------- */

function drawBackground(t) {
  ctx.fillStyle = "#03050c";
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(
    W / 2, H / 2, 2,
    W / 2, H / 2, 140
  );

  glow.addColorStop(0, "rgba(35,112,190,.17)");
  glow.addColorStop(.55, "rgba(10,42,94,.1)");
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  for (const star of stars) {
    const x = star.x - camera.x * star.z * .15;
    const y = star.y - camera.y * star.z * .1;
    const pulse = .3 + Math.sin(t * .001 + star.phase) * .25;

    ctx.fillStyle =
      `rgba(110,210,255,${pulse * star.z})`;

    ctx.fillRect(
      Math.floor(x),
      Math.floor(y),
      star.size,
      star.size
    );
  }

  ctx.fillStyle = "rgba(80,180,255,.035)";

  for (let y = 0; y < H; y += 3) {
    ctx.fillRect(0, y, W, 1);
  }
}

function drawMode7Grid() {
  const horizon = H * .665;
  const vanishX = W / 2 - camera.x * .08;

  ctx.strokeStyle = "rgba(45,120,200,.18)";
  ctx.lineWidth = 1;

  for (let i = 1; i < 25; i++) {
    const depth = i / 24;
    const y =
      horizon +
      Math.pow(depth, 2.15) * (H - horizon) +
      camera.y * .08;

    ctx.beginPath();
    ctx.moveTo(0, Math.floor(y));
    ctx.lineTo(W, Math.floor(y));
    ctx.stroke();
  }

  for (let x = -W * 2; x < W * 3; x += 16) {
    ctx.beginPath();
    ctx.moveTo(vanishX, horizon);
    ctx.lineTo(x + camera.x * .14, H);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(82,190,255,.45)";
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  ctx.lineTo(W, horizon);
  ctx.stroke();
}

function drawCrystal(c, t) {
  const p = project(c, t);

  if (
    p.x < -30 ||
    p.x > W + 30 ||
    p.y < -80 ||
    p.y > H + 20
  ) return;

  const left = Math.floor(p.x - p.width);
  const right = Math.floor(p.x + p.width);
  const top = Math.floor(p.y - p.height);
  const base = Math.floor(p.y);
  const tip = Math.floor(
    p.x + Math.sin(t * .001 + c.phase) * p.width
  );

  const main = c.hue === "cyan" ? "#4ddcff" : "#a86eff";
  const dark = c.hue === "cyan" ? "#14558f" : "#522a91";
  const light = c.hue === "cyan" ? "#d9fbff" : "#f4d9ff";

  ctx.save();
  ctx.globalAlpha = c.opacity;

  if (c.resonance > .05) {
    ctx.shadowColor = main;
    ctx.shadowBlur = 3 + c.resonance * 8;
    cultivationEnergy * 7;
  }

  ctx.fillStyle = "rgba(0,0,0,.36)";
  ctx.fillRect(left - 2, base, Math.max(3, right - left + 4), 2);

  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(left, base);
  ctx.lineTo(left + 1, top + 5);
  ctx.lineTo(tip, top);
  ctx.lineTo(right, top + 5);
  ctx.lineTo(right + 1, base);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(Math.floor(p.x), base);
  ctx.lineTo(tip, top);
  ctx.lineTo(right, top + 5);
  ctx.lineTo(Math.floor(p.x + 1), base);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = light;
  ctx.globalAlpha = c.opacity * .72;
  ctx.beginPath();
  ctx.moveTo(Math.floor(p.x), base);
  ctx.lineTo(tip, top);
  ctx.lineTo(Math.floor(p.x), top + 9);
  ctx.closePath();
  ctx.fill();

  if (p.height > 18) {
    ctx.strokeStyle = "rgba(225,250,255,.7)";
    ctx.beginPath();
    ctx.moveTo(Math.floor(p.x), top + 8);
    ctx.lineTo(
      Math.floor(p.x + rand(-1, 1)),
      base - 3
    );
    ctx.stroke();
  }

  if (Math.random() < .008 * c.depth) {
    particles.push({
      x: tip,
      y: top,
      vx: rand(-.18, .18),
      vy: rand(-.45, -.1),
      life: rand(20, 45),
      color: main
    });
  }

  ctx.restore();
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += .004 * dt;
    p.life -= dt;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = clamp(p.life / 40, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 1, 1);
  }

  ctx.globalAlpha = 1;
}

function drawVoid(t) {
  const x = lerp(pointer.x, W / 2, .25);
  const y = lerp(pointer.y, H / 2, .25);
  const pulse = 1 + Math.sin(t * .002) * .08;

  ctx.strokeStyle = "rgba(75,180,255,.18)";
  ctx.strokeRect(
    Math.floor(x - 18 * pulse),
    Math.floor(y - 18 * pulse),
    Math.floor(36 * pulse),
    Math.floor(36 * pulse)
  );

  ctx.strokeStyle = "rgba(90,220,255,.55)";
  ctx.strokeRect(
    Math.floor(x - 7),
    Math.floor(y - 7),
    15,
    15
  );

  ctx.fillStyle = "#010207";
  ctx.fillRect(
    Math.floor(x - 3),
    Math.floor(y - 3),
    7,
    7
  );
}

function drawInterface() {
  ctx.fillStyle = "#78dfff";
  ctx.font = "6px monospace";

  if (cultivationMode) {
  ctx.fillStyle = "rgba(210,245,255,.85)";
  ctx.fillText(
    "CULTIVATION // " +
    String(Math.floor(cultivationEnergy * 100)).padStart(3, "0") +
    "%",
    8,
    19
  );
}

  ctx.fillText(
    "QUARTZ VOID // DOCUMENTARY PASSAGE",
    8,
    10
  );

  ctx.fillStyle = "rgba(120,223,255,.55)";

  ctx.fillText(
    "JOURNEY " + String(Math.floor(journey)).padStart(6, "0"),
    8,
    H - 9
  );

  ctx.fillText(
    "MINERAL ACTIVITY " +
    Math.floor(activity * 100) + "%",
    W - 115,
    H - 9
  );
}

/* ----------------------------------------------------
   INTERACCIÓ
----------------------------------------------------- */

function updatePointer(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();

  pointer.targetX = clamp(
    (clientX - rect.left) / rect.width * W,
    0,
    W
  );

  pointer.targetY = clamp(
    (clientY - rect.top) / rect.height * H,
    0,
    H
  );

  if (!started) startAudio();

  updateAudio();
}

canvas.addEventListener("pointermove", event => {
  updatePointer(event.clientX, event.clientY);
});

canvas.addEventListener("pointerdown", event => {
  updatePointer(event.clientX, event.clientY);

  pointer.x = pointer.targetX;
  pointer.y = pointer.targetY;

  for (let i = 0; i < 3; i++) {
    createCrystal(
      camera.x + rand(-20, 20),
      rand(H * .54, H * .9),
      rand(.35, .9),
      rand(.5, 1)
    );
  }

  activity = clamp(activity + .2, 0, 1);

  crystalResonance(
    .8,
    (pointer.x / W - .5) * 2,
    1.2
  );
});

start.addEventListener("click", async () => {
  startAudio();

  if (audio.state === "suspended") {
    await audio.resume();
  }

  start.classList.add("hidden");
});

window.addEventListener("keydown", async event => {
  if (event.code !== "Space" && event.code !== "Enter") return;

  startAudio();

  if (audio.state === "suspended") {
    await audio.resume();
  }

  start.classList.add("hidden");
});

/* ----------------------------------------------------
   BUCLE
----------------------------------------------------- */

function render(now) {
  const dt = clamp(
    (now - lastTime) / 16.666,
    .2,
    3
  );

  lastTime = now;
  time = now;

  pointer.x = lerp(pointer.x, pointer.targetX, .12 * dt);
  pointer.y = lerp(pointer.y, pointer.targetY, .12 * dt);

  updateCamera(dt);
  cultivateQuartz(dt);
  updateCrystals(dt);
  updateAudio();

  drawBackground(now);
  drawMode7Grid();

  crystals
    .slice()
    .sort((a, b) => a.depth - b.depth)
    .forEach(c => drawCrystal(c, now));

  drawParticles(dt);
  drawVoid(now);
  drawInterface();

  requestAnimationFrame(render);
}

resetWorld();
requestAnimationFrame(render);
</script>
</body>
</html>
