<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flor D# còsmica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="universe">
    <canvas id="space"></canvas>

    <section id="interface">
      <div id="title">
        <span>FLOR D♯</span>
        <small>organisme sonor exoplanetari</small>
      </div>

      <div id="status">Toca la flor per despertar-la</div>

      <button id="soundButton" aria-label="Activar l'àudio">
        <span>◉</span>
      </button>

      <div id="progressions">
        <button data-progression="0" class="active">I</button>
        <button data-progression="1">II</button>
        <button data-progression="2">III</button>
        <button data-progression="3">IV</button>
        <button data-progression="4">V</button>
        <button data-progression="5">VI</button>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
